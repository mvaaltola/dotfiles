matches:
  - trigger: ":mv"
    replace: "Mikael Vaaltola"

  - trigger: ":br "
    replace: "Best regards,\nMikael Vaaltola"

  - trigger: ":yt "
    replace: "Ystävällisin terveisin,\nMikael Vaaltola"

  - trigger: ":bp "
    replace: "{{out}}"
    vars:
      - name: out
        type: shell
        params:
          cmd: "~/x/getpw 'Bitwarden'"

  - trigger: ":gp "
    replace: "{{out}}"
    vars:
      - name: out
        type: shell
        params:
          cmd: "~/x/getpw 'google-vaalto.la-main'"
  
  - trigger: ":tel "
    replace: "{{out}}"
    vars:
      - name: out
        type: shell
        params:
          cmd: "rbw get 'Mikael' --field Phone"

  - trigger: ":addr "
    replace: "{{out}}"
    vars:
      - name: out
        type: shell
        params:
          cmd: "rbw get 'Mikael' --field Address"
